[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "thesis-verifier"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "torch",
    "numpy",
    "scipy",
    "pyyaml",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["verifier*", "case_studies*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
